.ab-ph{border-radius:8px;overflow:hidden;border:1px solid #22364A;background:#0B1620}
.ab-ph img{width:100%;height:100%;display:block;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ab-ph:hover img{transform:scale(1.07)}
.ab-stack{height:100%;min-height:290px}
.ab-feat{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #22364A;border-bottom:1px solid #22364A}
.ab-f{display:flex;gap:12px;align-items:center;padding:16px 8px}
.ab-f:nth-child(1),.ab-f:nth-child(2){border-bottom:1px solid #22364A}.ab-f:nth-child(odd){border-right:1px solid #22364A}.ab-f:nth-child(even){padding-left:14px}
.ab-ic{width:44px;height:44px;border-radius:50%;border:1px solid #C8A25E;background:#050B11;color:#C8A25E;display:grid;place-items:center;flex:none;transition:transform .4s,background .3s}
.ab-ic svg{width:21px;height:21px}
.ab-f:hover .ab-ic,.ab-row:hover .ab-ic{transform:scale(1.12) rotate(-6deg);background:#C8A25E22}
.ab-f h4{font:600 15px 'Cormorant Garamond',Georgia,serif;color:#fff;margin:0 0 2px;font-size:16px}.ab-f p{margin:0;color:#aab4be;font-size:11.5px;line-height:1.4}
.ab-card{border:1px solid #22364A;border-radius:10px;background:#07101A;padding:16px;min-width:0}
.ab-touch{display:grid;grid-template-columns:1fr .86fr;grid-template-areas:"th tp" "tr tp";column-gap:12px;align-items:start}
.ab-th{grid-area:th}.ab-tr{grid-area:tr}.ab-tp{grid-area:tp;height:100%;min-height:250px}
.ab-touch h3{font-size:27px;margin-bottom:4px}.ab-touch .ab-th p{color:#aab4be;font-size:12px;margin:0 0 6px}
.ab-row{display:flex;gap:11px;align-items:flex-start;margin:11px 0}
.ab-row .ab-ic{width:36px;height:36px}.ab-row .ab-ic svg{width:17px;height:17px}
.ab-row b{display:block;color:#fff;font-size:12.5px}.ab-row div div{color:#aab4be;font-size:11.5px;word-break:break-word}.ab-row a{color:#fff}
.ab-map h3,.ab-msg h3{display:flex;gap:9px;align-items:center;font-size:19px;margin-bottom:4px}.ab-map h3 svg,.ab-msg h3 svg{width:18px;height:18px;color:#C8A25E}
.ab-map>p{color:#aab4be;font-size:12px;margin:0 0 10px}
.ab-map iframe{width:100%;height:170px;border:0;border-radius:6px;background:#142638;display:block;margin-bottom:10px}
.ab-fld{position:relative;margin-bottom:10px}.ab-fld svg{position:absolute;left:12px;top:14px;width:16px;height:16px;color:#7B8794}
.ab-msg input,.ab-msg textarea{width:100%;background:#050B11;border:1px solid #22364A;border-radius:5px;color:#fff;padding:12px 12px 12px 38px;font:14px Inter,system-ui,sans-serif;min-height:44px;transition:border .2s,box-shadow .2s}
.ab-msg textarea{min-height:92px;resize:vertical}
.ab-msg input:focus,.ab-msg textarea:focus{border-color:#C8A25E;outline:none;box-shadow:0 0 0 3px #C8A25E33}
.ab-send{position:relative;overflow:hidden;width:100%;background:#C8A25E;color:#0B1620;border:0;border-radius:5px;padding:13px;font-weight:700;font-size:14px;cursor:pointer}
.ab-foot{margin-top:18px;border-top:1px solid #22364A;padding:20px 16px 96px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;color:#aab4be;font-size:12px;align-items:start}
.ab-foot .lg{display:flex;flex-direction:column;align-items:center;text-align:center}
.ab-foot .lg img{width:46px;height:auto}.ab-foot .lg b{font:600 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;color:#C8A25E}.ab-foot .lg small{font-size:9px;color:#fff}
.ab-foot h5{margin:0 0 8px;color:#fff;font-size:12.5px}.ab-foot a{display:block;margin:5px 0;cursor:pointer;font-size:11.5px}.ab-foot a:hover{color:#C8A25E}
.ab-soc{display:flex;gap:8px;flex-wrap:wrap}.ab-soc a{width:32px;height:32px;border-radius:50%;border:1px solid #C8A25E88;color:#C8A25E;display:grid!important;place-items:center;margin:0}.ab-soc svg{width:16px;height:16px}.ab-soc a:hover{background:#C8A25E;color:#0B1620}
.ab-copy{grid-column:1/-1;text-align:center;border-top:1px solid #22364A;padding-top:14px;font-size:11.5px}
/* scroll reveal */
.ab.rdy .rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.ab.rdy .rv.l{transform:translateX(-34px)}.ab.rdy .rv.r{transform:translateX(34px)}
.ab.rdy .rv.in{opacity:1;transform:none}
.ab.rdy .ab-ph img{clip-path:inset(0 0 100% 0);transition:clip-path 1.2s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ab.rdy .ab-ph.in img{clip-path:inset(0 0 0 0)}
.ab.rdy .ab-ic.rv{transform:scale(.4)}.ab.rdy .ab-ic.rv.in{transform:none}
@media(min-width:900px){
.ab{font-size:15px}.ab-hero{padding:34px 48px 44px}.ab-hero::after{background:linear-gradient(90deg,#050B11 38%,#050B1199 60%,#05B1100 100%)}
.ab-hero h1{font-size:64px}.ab-sub{font-size:12px;letter-spacing:.28em}.ab-hero p{display:block}
.ab-main{grid-template-columns:1.1fr .9fr 1fr;padding:28px 40px 6px;gap:22px}
.ab-who2{grid-column:1/3;grid-template-columns:1fr 1fr;gap:22px;padding:0}
.ab-who p{font-size:15px}.ab-who h2{font-size:40px}.ab-stack{min-height:380px}
.ab-feat{grid-column:1;align-self:start}.ab-f{align-items:flex-start;flex-direction:column;gap:8px;padding:20px 14px}.ab-f h4{font-size:19px}.ab-f p{font-size:13.5px}
.ab-touch{grid-column:3;grid-row:1;display:block;padding:22px}.ab-touch h3{font-size:30px}.ab-touch .ab-th p{font-size:14px}.ab-row b{font-size:15px}.ab-row div div{font-size:14px}.ab-row .ab-ic{width:44px;height:44px}
.ab-tp{height:170px;min-height:0;margin-top:12px}
.ab-map{grid-column:2}.ab-msg{grid-column:3}.ab-map iframe{height:230px}
.ab-foot{grid-template-columns:1.4fr 1fr 1fr;padding:30px 48px 40px}.ab-foot .lg{align-items:flex-start;text-align:left}
}

.hero.hx::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:28%;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent,#C8A25E2e,transparent);transform:skewX(-20deg);animation:sweep 7s 2.6s ease-in-out infinite}
@keyframes kb2{from{transform:scale(1) translateX(0)}to{transform:scale(1.13) translateX(-3%)}}
@keyframes sweep{0%{left:-40%}45%,100%{left:140%}}
.hero.hx small{font-size:12px;letter-spacing:.34em;font-weight:700;display:inline-flex;align-items:center;gap:12px;position:relative;z-index:2}
.hero.hx small::after{content:"";width:46px;height:2px;background:var(--m);transform-origin:left;animation:grow2 1s .6s both}
@keyframes grow2{from{transform:scaleX(0)}to{transform:none}}
.hero.hx h1{animation:none;perspective:600px;max-width:9.5em;position:relative;z-index:2;margin:14px 0 14px}
.hero.hx h1 span{display:inline-block;opacity:0;transform:translateY(46px) rotateX(55deg);transform-origin:50% 100%;animation:wd 1s calc(.25s + var(--i)*.13s) forwards cubic-bezier(.2,.7,.2,1)}
@keyframes wd{to{opacity:1;transform:none}}
.hero.hx p{position:relative;z-index:2;animation:rise .9s .95s both cubic-bezier(.2,.7,.2,1)}
.hcta{position:relative;z-index:2;margin-top:22px;animation:rise .9s 1.2s both cubic-bezier(.2,.7,.2,1)}
.hcta .b{padding:14px 30px;position:relative;overflow:hidden;animation:pulse 2.8s 2.5s ease-in-out infinite}
.hcta .b::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:sheen3 3.4s 2.2s infinite}
@keyframes sheen3{0%{left:-70%}40%,100%{left:140%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #C8A25E00}50%{box-shadow:0 0 0 10px #C8A25E22}}
.hdust{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hdust i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#E8C98A;box-shadow:0 0 8px #C8A25E;opacity:0;animation:dust var(--t) var(--dl) linear infinite}

.trust div:hover .ti{transform:rotate(-8deg) scale(1.15);background:#C8A25E22}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mq{overflow:hidden;white-space:nowrap;background:#C8A25E;color:#0B1620;padding:9px 0;font-weight:700;font-size:12px;letter-spacing:.22em}
.mq>div{display:inline-flex;animation:mqm 32s linear infinite}.mq span{padding-right:0}
@keyframes mqm{to{transform:translateX(-50%)}}
.sh{padding:30px 16px 4px;text-align:center}
.sh small{color:#8A6A2C;letter-spacing:.34em;font-weight:700;font-size:11px}
.sh h2{font:600 clamp(30px,7vw,42px)/1.1 'Cormorant Garamond',Georgia,serif;margin:6px 0 10px;color:var(--ink)}
.sh i{display:block;width:70px;height:2px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--m),transparent);animation:grow2 1.2s 1.4s both}

.chips .chip:nth-child(1){animation-delay:1.5s}.chips .chip:nth-child(2){animation-delay:1.6s}.chips .chip:nth-child(3){animation-delay:1.7s}.chips .chip:nth-child(4){animation-delay:1.8s}.chips .chip:nth-child(n+5){animation-delay:1.9s}
@keyframes chipin{from{opacity:0;transform:translateX(26px)}}
.list .card.rv:not(.in):not(.seen){opacity:0}
.list .card.rv.in{animation:cardin .9s var(--d,0s) backwards cubic-bezier(.2,.7,.2,1)}
@keyframes cardin{from{opacity:0;transform:translateY(44px) scale(.94) rotate(-1.2deg)}}
.list .card{background:#fff;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.list .card:hover{transform:translateY(-7px);border-color:var(--m);box-shadow:0 18px 38px #0B162026,0 0 0 1px #C8A25E55}

.list .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff44 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.list .card:hover .pic::after{animation:sheen4 .9s}
@keyframes sheen4{to{transform:translateX(130%)}}
.list .tag:not([style]){background:linear-gradient(100deg,#F1E3C4 30%,#fff7e0 50%,#F1E3C4 70%);background-size:220% 100%;animation:tagsh 3.4s ease-in-out infinite}
@keyframes tagsh{from{background-position:120% 0}to{background-position:-120% 0}}
.heart.on svg{animation:hp .55s}
