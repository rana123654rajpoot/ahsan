<div class="ab-card ab-msg"><h3>${ABI.send}Send Us a Message</h3><form onsubmit="return abSend(event)"><input name="an" placeholder="Your Name *" required autocomplete="name"><input name="ae" type="email" placeholder="Your Email *" required autocomplete="email"><textarea name="am" placeholder="Your Message *" required></textarea><button class="ab-send" type="submit">Send Message →</button></form></div></div>
<div class="ab-foot"><div class="lg"><b>ALNAFAY</b>Gents Unstitched<br><small>Quality . Comfort . Style</small></div><div><h5>Quick Links</h5><a data-go="#/shop">Home</a><a data-go="#/shop">Shop</a><a data-go="#/about">About Us</a><a data-go="#/contact">Contact</a></div><div><h5>Customer Care</h5><a data-go="#/exchange">Return &amp; Exchange</a><a data-go="#/contact">Contact Us</a></div><div><h5>Follow Us</h5>${ig?`<a href="${/^https?:/.test(ig)?esc(ig):'https://instagram.com/'+esc(ig.replace(/^@/,''))}" target="_blank" rel="noopener">Instagram</a>`:''}${w?`<a href="https://wa.me/${w}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div><div class="ab-copy">© ${new Date().getFullYear()} ALNAFAY. All rights reserved.</div></div></div>`}
function infoV(k){const ph=S.phone||'',wa=(S.wa||'').replace(/\D/g,''),ig=S.ig||'',em=S.email||'',loc=S.location||'',addr=S.address||'',hours=S.hours||'',owner=S.owner||'';if(k==='about')return aboutV();const T={exchange:['Exchange Policy','<p>Unstitched fabric can be exchanged if it is uncut and unused. Contact us with your order number to arrange an exchange.</p>'],contact:['Contact Us',`<p>Call or message us for orders, fabric details and delivery.</p><div style="display:grid;gap:10px;margin-top:14px">${ph?`<a class="b f" href="tel:${esc(ph)}">${I('phone',18)} ${esc(ph)}</a>`:''}${wa?`<a class="b l" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}${em?`<a class="b" href="mailto:${esc(em)}">✉ ${esc(em)}</a>`:''}${!ph&&!wa&&!em?'<p>Contact details will be added soon.</p>':''}</div>`]}[k];return `<div class="pad"><h2>${T[0]}</h2>${T[1]}</div>`}
function render(){const h=(location.hash||'#/shop').slice(2).split('/'),k=h[0];const V={shop:()=>list(),sale:()=>list(1),p:()=>detail(+h[1],h[2]),cart:cartV,checkout:checkV,done:doneV,account:acctV,about:()=>infoV('about'),contact:()=>infoV('contact'),exchange:()=>infoV('exchange')};
$('#v').innerHTML=(V[k]||V.shop)();$('#hm').innerHTML=I('menu',28);$('#hs').innerHTML=I('search',26);
$('#hc').innerHTML=I('cart',26)+(cart.length?`<span class="badge">${cart.length}</span>`:'');
$('#lg').innerHTML=I('leaf',26)+brand();
const tabs=[['shop','Home','home'],['shop','Shop','shop'],['sale','Sale','tag'],['account','Account','user'],['cart','Cart','cart']];
$('#bn').innerHTML=tabs.map((t,i)=>`<button data-go="#/${t[0]}" class="${(k===t[0]||(k==='p'&&i==1))&&i!==0?'on':''}">${I(t[2])}${t[1]}${t[0]==='cart'&&cart.length?`<span class="badge">${cart.length}</span>`:''}</button>`).join('');
$('#sb').hidden=!(k==='shop'||k==='sale')||$('#sb').dataset.o!=='1';const w=waNum(),wf=$('#wf');wf.hidden=!w;if(w)wf.href='https://wa.me/'+w}
$('#hn').innerHTML=[['shop','Shop'],['sale','Sale'],['about','About'],['contact','Contact'],['account','Account']].map(m=>`<a data-go="#/${m[0]}">${m[1]}</a>`).join('');
$('#mnn').innerHTML=[['shop','Shop','shop'],['sale','Sale','tag'],['account','Account','user'],['about','About Us','info'],['contact','Contact Us','phone'],['exchange','Exchange','swap']].map(m=>`<a data-go="#/${m[0]}">${I(m[2])}${m[1]}</a>`).join('');
document.addEventListener('click',e=>{const t=e.target.closest('button,a,[data-go],.mn');if(!t)return;const d=t.dataset;
if(t.id==='mn'){t.classList.remove('on');return}
if(d.m){$('#mn').classList.add('on');return}
if(d.s){const b=$('#sb');b.dataset.o=b.dataset.o==='1'?'0':'1';if(b.dataset.o==='1'&&!/#\/(shop|sale)/.test(location.hash))location.hash='#/shop';else render();if(b.dataset.o==='1')setTimeout(()=>$('#sq').focus(),50);return}
if(d.fav){const i=+d.fav;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];localStorage.setItem('an_fav',JSON.stringify(fav));t.classList.toggle('on');e.stopPropagation();return}
if(d.add){const p=P.find(x=>x.id===+d.add);addLine(line(p,0,1));toast('Added to cart');render();return}
if(d.chip!==undefined){F=d.chip;render();return}
if(d.th!==undefined){D.f=+d.th;render();return}
if(d.opt!==undefined){D.o=+d.opt;render();return}
if(d.q){D.q=Math.max(1,D.q+ +d.q);render();return}
if(d.addd||d.buy){const p=P.find(x=>x.id===D.id),l=line(p,D.o,D.q);if(d.addd){addLine(l);toast('Added to cart');render()}else{CK=[l];CK.buy=1;location.hash='#/checkout'}return}
if(d.cq){const[k,n]=d.cq.split(':');cart[+k].qty=Math.max(1,cart[+k].qty+ +n);saveC();render();return}
if(d.rm!==undefined){cart.splice(+d.rm,1);saveC();render();return}
if(d.co){CK=[...cart];location.hash='#/checkout';return}
if(d.at){AT=d.at;render();return}
if(d.lo){localStorage.removeItem('an_user');render();return}
if(d.go){$('#mn').classList.remove('on');location.hash=d.go;window.scrollTo(0,0)}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){Q=e.target.value.trim().toLowerCase();const c=$('#v .list');const y=$('#sq').selectionStart;render();$('#sb').hidden=false;const s=$('#sq');s.value=e.target.value;s.focus();s.setSelectionRange(y,y)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.id;
if(f==='of'){const b=$('#ob');b.disabled=true;b.textContent='Placing order…';const v=i=>$('#'+i).value.trim();try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:CK.map(c=>({product_id:c.id,product:c.name,tone:c.tone,option:c.opt,unit_price:c.unit,quantity:c.qty})),name:v('on'),email:v('oe'),phone:v('op'),city:v('oc'),address:v('oa'),note:v('ot')})});if(!r.ok)throw 0;const ids=[(await r.json()).id];
DONE=ids;if(!CK.buy){cart=[];saveC()}CK=[];location.hash='#/done'}catch(x){b.disabled=false;b.textContent='Place Order';$('#om').textContent='Order could not be sent. Check your connection and try again.'}}
if(f==='af'){const m=$('#am'),i=$('#ai').value.trim(),p=$('#ap').value,K='alnafay_account_v17';
if(AT==='signup'){if(p.length<6){m.className='msg e';m.textContent='Password must be at least 6 characters.';return}localStorage.setItem(K,JSON.stringify({name:$('#an').value.trim(),id:i,pass:p}));AT='login';render();$('#am').textContent='Account created. You can now login.'}
else{const a=JSON.parse(localStorage.getItem(K)||'null');if(!a){m.className='msg e';m.textContent='No account found. Please sign up first.';return}
if(a.id!==i||a.pass!==p){m.className='msg e';m.textContent='Incorrect email/phone or password.';return}localStorage.setItem('an_user',JSON.stringify({name:a.name,id:a.id}));location.hash='#/shop';render()}}});
addEventListener('hashchange',()=>{const v=$('#v');v.classList.remove('pt');void v.offsetWidth;v.classList.add('pt');render()});
(async()=>{render();try{[P,S]=await Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/settings').then(r=>r.json())])}catch(e){$('#v').innerHTML='<div class="empty">Could not load products. Please refresh the page and try again.</div>';return}
P=P.map(p=>({...p,id:+p.id}));cart=cart.filter(c=>P.some(p=>p.id===c.id)).map(({img,...c})=>c);saveC();render()})();
</script></body></html>
