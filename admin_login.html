<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>AL NAFAY — Owner Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#064B4A;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#10292a;padding:20px}
.box{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:30px 24px;box-shadow:0 20px 60px #0006}
h1{margin:0 0 4px;font:700 30px Georgia,serif;color:#064B4A;letter-spacing:1px;text-align:center}.sub{text-align:center;color:#5d7473;margin:0 0 24px;font-size:13px;letter-spacing:2px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}input{width:100%;border:1.5px solid #dde8e5;border-radius:12px;padding:14px;font:inherit;outline:0}input:focus{border-color:#1FBF8F}
button{width:100%;margin-top:16px;height:50px;border:0;border-radius:12px;background:#064B4A;color:#fff;font:600 16px inherit;cursor:pointer}button:disabled{opacity:.6}
#m{margin-top:12px;min-height:20px;color:#c0392b;font-weight:500;text-align:center}
</style></head><body>
<form class="box" id="f"><h1>AL NAFAY</h1><p class="sub">OWNER LOGIN</p>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" autofocus required>
<button id="b">Login</button><div id="m" role="alert"></div></form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('m');b.disabled=true;m.textContent='';
try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});
if(r.ok){location.href='/admin.html';return}const d=await r.json().catch(()=>({}));m.textContent=d.error||'Login failed';}catch(x){m.textContent='Could not reach the server.'}b.disabled=false});
</script></body></html>
