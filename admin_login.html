<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>AL NAFAY — Owner Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--d:#0B1620;--m:#C8A25E;--ml:#F1E3C4;--ink:#14202C;--muted:#5E6772}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#F1E3C4 0,transparent 32%),linear-gradient(135deg,#050B11,#0B1620 55%,#13263A);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink)}
.login-wrap{width:min(430px,100%);position:relative}.login-glow{position:absolute;inset:-35px;border-radius:42px;background:#1fbf8f22;filter:blur(30px);animation:glow 3s ease-in-out infinite}
.login-card{position:relative;background:#fff;border:1px solid #ffffffaa;border-radius:28px;padding:30px;box-shadow:0 28px 80px #001c1c66;overflow:hidden}.login-card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--m),#C8A25E,var(--m))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:52px;height:52px;border-radius:16px;background:var(--d);color:var(--ml);display:grid;place-items:center;font:700 25px 'Cormorant Garamond',Georgia,serif;box-shadow:0 10px 24px #064b4a2b}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.brand b{display:block;font:700 28px 'Cormorant Garamond',Georgia,serif;color:var(--d)}h1{margin:0;font:700 30px 'Cormorant Garamond',Georgia,serif;color:var(--d)}.sub{margin:5px 0 20px;color:var(--muted)}label{display:block;font-weight:700;font-size:12px;margin:12px 0 6px}input{width:100%;padding:13px 14px;border:1.5px solid #d9e7e3;border-radius:13px;outline:none;background:#fbfefd}input:focus{border-color:var(--m);box-shadow:0 0 0 4px #bdf0d544}button{width:100%;margin-top:16px;border:0;border-radius:13px;padding:14px;background:var(--d);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px #064b4a26;transition:.2s}button:hover{transform:translateY(-1px);background:#075e5b}button:disabled{opacity:.6;transform:none}#m{min-height:20px;margin-top:12px;color:#b42318;background:#fff1f0;border:1px solid transparent;border-radius:10px;padding:0;text-align:center;font-weight:600}#m:not(:empty){padding:9px 11px;border-color:#ffd4d0}.hint{margin-top:16px;text-align:center;color:var(--muted);font-size:11px}
@keyframes glow{0%,100%{transform:scale(.98);opacity:.65}50%{transform:scale(1.03);opacity:1}}
</style><style>body{background:radial-gradient(circle at 15% 10%,#1d3248 0,transparent 35%),linear-gradient(135deg,#050B11,#0B1620 55%,#13263A)!important}.login-card{background:#101F2E!important;color:#E8ECF0!important;border-color:#22364A!important}.login-card h1,.login-card b,.login-card label{color:#E8ECF0!important}.sub,.hint,.brand small{color:#8FA1B3!important}.brand-mark{background:#0B1620!important;color:#C8A25E!important;border:1px solid #C8A25E}input{background:#142638!important;border:1.5px solid #22364A!important;color:#fff!important;min-height:52px;border-radius:10px}input:focus{border-color:#C8A25E!important;outline:none;box-shadow:0 0 0 3px #C8A25E33}#b,button{background:#C8A25E!important;color:#0B1620!important;font-weight:700}#m{color:#E05A5A!important}</style></head><body>
<div class="login-wrap"><div class="login-glow"></div><div class="login-card">
<div class="brand"><div class="brand-mark">AN</div><div><b>AL NAFAY</b><small>OWNER DASHBOARD</small></div></div>
<h1>Welcome back</h1><p class="sub">Sign in to manage products, orders and your store.</p>
<form id="f"><label for="p">Owner Password</label><input id="p" type="password" autocomplete="current-password" autofocus required placeholder="Enter your password"><button id="b">Login to Dashboard</button><div id="m" role="alert"></div></form>
<div class="hint">Secure owner access · AL NAFAY</div>
</div></div>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('m');b.disabled=true;m.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});if(r.ok){location.href='/admin.html';return}const d=await r.json().catch(()=>({}));m.textContent=d.error||'Login failed';}catch(x){m.textContent='Could not reach the server.'}b.disabled=false});
</script></body></html>
